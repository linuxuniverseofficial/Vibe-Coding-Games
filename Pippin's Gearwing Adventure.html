html,body{height:100%}

  background-image:radial-gradient(ellipse at 50% 0%, #1d2638 0%, var(--bg) 70%);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; gap:14px; overflow-x:hidden;
}
.frame{
  position:relative; max-width:100%;
  border:3px solid var(--brass); border-radius:4px;
  box-shadow:0 0 0 2px #1a0f08, 0 0 0 5px var(--brass-lo), 0 18px 40px rgba(0,0,0,.6);
  background:#000; line-height:0;
}
canvas{display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none}
.legend{
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px 18px; max-width:62rem;
  font-size:15px; color:var(--muted); line-height:1.4;
}
.legend span{display:inline-flex; align-items:center; gap:6px}
kbd{
  font-family:var(--font-ui); font-size:13px; color:var(--brass-hi);
  background:var(--panel); border:1px solid var(--brass-lo); border-bottom-width:3px;
  border-radius:3px; padding:1px 6px; min-width:1.2em; text-align:center;
}
.touch{position:absolute; inset:0; pointer-events:none; display:none}
.touch.on{display:block}
.pad{position:absolute; bottom:6%; display:flex; gap:8px; pointer-events:auto}
.pad.l{left:3%} .pad.r{right:3%; flex-wrap:wrap; width:min(40%,190px); justify-content:flex-end}
.tb{
  width:clamp(40px,11vw,58px); height:clamp(40px,11vw,58px); border-radius:50%;

}
.tb.act{background:rgba(79,240,216,.35)}
button:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
@media (pointer:fine){ .touch.on{display:none} }

/* pixel gear generator */
function makeGear(R,teeth,td,spokes,frames,pal){
  const size=R*2+3,c0=R+1,out=[];const period=spokes?2*Math.PI/spokes:2*Math.PI/teeth;
  for(let f=0;f<frames;f++){
    const ang=f/frames*period;const [c,x]=mk(size,size);const img=x.createImageData(size,size);const mask=new Uint8Array(size*size);const col=new Array(size*size);
    const rimIn=R-td-Math.max(2,Math.round(R*.16)),hub=Math.max(2,R*.26),hole=Math.max(1,R*.11);
    for(let y=0;y<size;y++)for(let xx=0;xx<size;xx++){
      const dx=xx-c0,dy=y-c0,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
      const ph=((((a-ang)*teeth/(2*Math.PI))%1)+1)%1;const tooth=ph<.46;
      if(r>(tooth?R:R-td))continue;if(r<hole)continue;
      let tone;const lit=(-dx-dy)/(r||1);
      if(r<hub){tone=lit>.3?'hi':'mid'}
      else if(r<rimIn){
        if(!spokes)tone='mid';else{let sa=((a-ang)%(2*Math.PI/spokes)+2*Math.PI)%(2*Math.PI/spokes);sa=Math.min(sa,2*Math.PI/spokes-sa);if(sa*r<Math.max(1.5,R*.07))tone=lit>0?'mid':'lo';else continue}
      }else tone=lit>.45?'hi':lit<-.45?'lo':'mid';
      if(r>R-td-1&&r<R-td+.5&&!tooth)tone='lo';
      mask[y*size+xx]=1;col[y*size+xx]=tone;
    }
    for(let y=0;y<size;y++)for(let xx=0;xx<size;xx++){const i=y*size+xx;if(!mask[i])continue;
      const edge=xx===0||y===0||xx===size-1||y===size-1||!mask[i-1]||!mask[i+1]||!mask[i-size]||!mask[i+size];
      const [r,g,b]=hex(edge?pal.out:pal[col[i]]);const o=i*4;img.data[o]=r;img.data[o+1]=g;img.data[o+2]=b;img.data[o+3]=255}
    x.putImageData(img,0,0);out.push(c);
  }
  return out;
}

  const ax=W-14+((t>>3)%2);ctx.fillStyle='#f2cc6a';ctx.fillRect(ax-4,10,4,1);ctx.fillRect(ax-1,8,1,5);ctx.fillRect(ax,9,1,3);ctx.fillRect(ax+1,10,1,1);
  // mini map
  panel(4,H-22,108,18);text('STEAMPORT',8,H-19,'#c8ccd6',1,null);ctx.fillStyle='#2a2e40';ctx.fillRect(8,H-11,100,3);
  for(const c of checks){ctx.fillStyle=c.on?'#4ff0d8':'#6a7086';ctx.fillRect(8+Math.round(c.x/LWpx*100),H-12,1,5)}
  ctx.fillStyle='#ff4030';ctx.fillRect(8+Math.round(LEVER.x/LWpx*100),H-12,2,2);ctx.fillStyle='#f2cc6a';ctx.fillRect(105,H-13,3,7);
  const pm=8+Math.round(clamp(P.x/LWpx,0,1)*98);ctx.fillStyle='#ffffff';ctx.fillRect(pm,H-13,2,7);ctx.fillStyle='#f59a2a';ctx.fillRect(pm,H-7,2,1);
  text(fmtTime(timeT),108,H-19,'#8d93a6',1,null,'right');
  if(toast){const a=Math.min(1,toast.d/20,(toast.max-toast.d)/10);ctx.globalAlpha=a;const tw=textW(toast.t)+16;panel(W/2-tw/2,60,tw,13);text(toast.t,W/2,64,'#f4f0e2',1,'#141623','center');ctx.globalAlpha=1}
  if(muted)text('SOM OFF',W-6,H-10,'#8d93a6',1,null,'right');
}
function fmtTime(f){const s=Math.floor(f/60);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function drawTitle(t){
  cam.x=(Math.sin(t*.0015)*.5+.5)*900;cam.y=LHpx-H;
  drawBg(t);drawWorld(t);drawFog(t);
  ctx.fillStyle='rgba(10,12,22,.45)';ctx.fillRect(0,0,W,H);
  logoText("PIPPIN'S",W/2,18,4,'#f2cc6a','#c48a32','#8e5a20');
  logoText('GEARWING',W/2,44,6,'#ffe08a','#d89a3a','#9a5e1c');
  const aw=textW('ADVENTURE',2)+16;ctx.fillStyle='#141623';ctx.fillRect(W/2-aw/2-1,81,aw+2,16);ctx.fillStyle='#14706c';ctx.fillRect(W/2-aw/2,82,aw,14);ctx.fillStyle='#2fd0bc';ctx.fillRect(W/2-aw/2,82,aw,1);
  text('ADVENTURE',W/2,85,'#e8fffb',2,'#0a3a38','center');
  // big pippin
  const px=W/2+80,py=120+Math.sin(t*.05)*5;ctx.save();ctx.translate(Math.round(px),Math.round(py));ctx.scale(2,2);
  for(let i=0;i<2;i++){const len=5+Math.floor(Math.random()*5);ctx.fillStyle='#2fd0bc';ctx.fillRect(3+i*3,17,3,len);ctx.fillStyle='#b8fff6';ctx.fillRect(4+i*3,17,1,len-2)}
  ctx.drawImage(S.peng.jump,0,0);ctx.translate(19,16);ctx.rotate(-1.15);ctx.drawImage(S.wrench,-1,-3);ctx.restore();glow(px+10,py+40,40,'#4ff0d8',.4);
  ctx.fillStyle='rgba(10,12,22,.65)';ctx.fillRect(W/2-150,105,190,85);
  text('UMA FASE - STEAMPORT',W/2-60,112,'#c8ccd6',1,'#141623','center');
  if((t>>5)%2===0)text('PRESSIONE ENTER OU ESPACO',W/2-60,150,'#ffe08a',1,'#141623','center');
  text('SETAS ANDAR  ESPACO PULO/JETPACK',W/2-60,172,'#8d93a6',1,'#141623','center');
  text('X CHAVE  C TURBO  V BOMBA',W/2-60,180,'#8d93a6',1,'#141623','center');
}
function drawWin(t){
  if(winT<150)return;const a=Math.min(1,(winT-150)/40);ctx.globalAlpha=a;
  ctx.fillStyle='rgba(8,10,18,.6)';ctx.fillRect(0,0,W,H);panel(W/2-110,40,220,130);
  logoText('MOTOR ATIVADO!',W/2,52,2,'#ffe08a','#d89a3a','#9a5e1c');
  text('STEAMPORT VOLTOU A FUMEGAR',W/2,74,'#9dfff2',1,'#141623','center');
  const rows=[['ENGRENAGENS',gearsGot+' / '+TOTAL_GEARS],['TEMPO',fmtTime(timeT)],['QUEDAS',String(deaths)]];
  rows.forEach((r,i)=>{text(r[0],W/2-80,94+i*14,'#c8ccd6');text(r[1],W/2+80,94+i*14,'#f2cc6a',1,'#141623','right')});
  const rank=gearsGot===TOTAL_GEARS&&deaths===0?'MESTRE MECANICO':gearsGot>=TOTAL_GEARS*.75?'ENGENHEIRO CHEFE':gearsGot>=TOTAL_GEARS*.4?'APRENDIZ DE CALDEIRA':'GRAXEIRO';
  text('TITULO: '+rank,W/2,140,'#ffe08a',1,'#141623','center');
  if((t>>5)%2===0)text('ENTER PARA JOGAR DE NOVO',W/2,156,'#f4f0e2',1,'#141623','center');
  ctx.globalAlpha=1;
}

/* ---------------- main loop ---------------- */
function step1(){
  frame++;
  if(pressed.mute){muted=!muted;if(master)master.gain.value=muted?0:.55}
  if(state==='title'){if(pressed.start||pressed.jump||pressed.atk){reset();updateCam(true);state='play';startMusic();say('DOCA 4 - CHEGUE AO MOTOR PRINCIPAL!',200)}}
  else if(state==='play'){
    if(pressed.pause){state='pause'}else{timeT++;updatePlayer();updateWorld();updateCam(false)}
  }else if(state==='pause'){if(pressed.pause||pressed.start)state='play'}
  else if(state==='dead'){deadT++;updateWorld();if(deadT===40){doRespawn();updateCam(true);P.pitDeath=false;fade=24}}
  else if(state==='win'){winT++;ENGINE.t++;updateWorld();P.vx*=.8;P.vy=Math.min(P.vy+GRAV,MAXFALL);moveBody(P,true);updateCam(false);
    if(winT%6===0)bgParts.push({x:ENGINE.x+128,y:ENGINE.y-150,f:1,fy:1,vx:.3+Math.random()*.3,vy:-1-Math.random(),s:6,life:120,max:120,col:'#c8ccd6'});
    if(winT%20===0)sparks(ENGINE.x+20+Math.random()*120,ENGINE.y-60-Math.random()*60,6,'#ffd27a');
    if(winT>200&&(pressed.start||pressed.jump)){state='title'}}
  if(toast&&--toast.d<=0)toast=null;
  if(state!=='title')updateBg();else if(frame%2===0)updateBg();
  if(shake>0)shake*=.85;if(shake<.3)shake=0;
  for(const k in pressed)pressed[k]=false;
}
function render(){
  const t=frame;
  if(state==='title'){drawTitle(t);return}
  ctx.save();if(shake)ctx.translate(Math.round((Math.random()-.5)*shake),Math.round((Math.random()-.5)*shake));
  drawBg(t);drawWorld(t);drawEntities(t);
  // win-time smoke column in world space
  for(const p of bgParts){if(p.f!==1)continue;const a=p.life/p.max;ctx.globalAlpha=a*.6;ctx.fillStyle=p.col;const s=Math.round(p.s);ctx.fillRect(Math.round(p.x-cam.x-s/2),Math.round(p.y-cam.y-s/2),s,s);p.s+=.08}ctx.globalAlpha=1;
  drawFog(t);ctx.restore();
  drawHUD(t);
  if(state==='pause'){ctx.fillStyle='rgba(8,10,18,.6)';ctx.fillRect(0,0,W,H);logoText('PAUSA',W/2,90,3,'#ffe08a','#d89a3a','#9a5e1c');text('P OU ENTER PARA CONTINUAR',W/2,118,'#c8ccd6',1,'#141623','center')}
  if(fade>0&&state==='play'){ctx.fillStyle='rgba(8,10,18,'+(fade/24)+')';ctx.fillRect(0,0,W,H);fade--}
  if(state==='dead'){const a=deadT<20?deadT/20:deadT<40?1:0;ctx.fillStyle='rgba(8,10,18,'+a+')';ctx.fillRect(0,0,W,H)}
  if(state==='win')drawWin(t);
}
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(.1,(now-last)/1000);last=now;let n=0;while(acc>=1/60&&n<5){step1();acc-=1/60;n++}render();requestAnimationFrame(loop)}

/* ---------------- sizing ---------------- */
function fit(){const fr=document.getElementById('frame');const lg=document.querySelector('.legend');const aw=document.body.clientWidth-(parseFloat(getComputedStyle(document.body).paddingLeft)+parseFloat(getComputedStyle(document.body).paddingRight))-10;
  const ah=window.innerHeight-(lg?lg.offsetHeight:0)-60;let s=Math.min(aw/W,ah/H);if(s>=2)s=Math.floor(s);s=Math.max(.8,s);fr.style.width=Math.floor(W*s+6)+'px'}
addEventListener('resize',fit);

/* ---------------- boot ---------------- */
buildPenguin();buildEnemies();bakeSky();bakeLayers();bakeWorld();bakeFog();PICK=makeGear(6,8,2,0,8,PICKPAL);
reset();fit();requestAnimationFrame(loop);
window.__pippin={S,ctx,get P(){return P},get state(){return state},set state(v){state=v},cam,reset,startWin,LEVER,BR};
})();
</script>
